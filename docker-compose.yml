# docker-compose.yml
# ──────────────────────────────────────────────
# Surbi 공통 서비스 정의 (Base)
# 실행 시 반드시 local 또는 prod override와 함께 사용
# 로컬: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# 프덕: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────

services:

  # ── FastAPI 백엔드 ──────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      SBSC_API_KEY: ${SBSC_API_KEY}
      SEOUL_API_KEY: ${SEOUL_API_KEY}
      BIZINFO_API_KEY: ${BIZINFO_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ./data:/app/data
    networks:
      - surbi_net

  # ── ARQ Worker (비동기 배치/ML 큐) ──────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq app.workers.main.WorkerSettings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
    networks:
      - surbi_net

  # ── PostgreSQL 17 + PostGIS 3.4 ─────────────
  postgres:
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - surbi_net

  # ── Redis 7 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surbi_net

  # ── Nginx 리버스 프록시 ──────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - surbi_net

volumes:
  postgres_data:
  redis_data:

networks:
  surbi_net:
    driver: bridge
