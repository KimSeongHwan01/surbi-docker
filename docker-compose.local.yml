# docker-compose.local.yml
# ──────────────────────────────────────────────
# 로컬 개발 환경 전용 override
# - 포트를 호스트에 직접 노출 (디버깅 편의)
# - 코드 볼륨 마운트로 hot reload 지원
# ──────────────────────────────────────────────

services:

  api:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DEBUG: "true"

  worker:
    volumes:
      - .:/app
    environment:
      ENVIRONMENT: local

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
