# nginx/nginx.prod.conf
# 프로덕션 — Cloudflare Full (Strict) 모드 기준

# Rate Limit Zone: http 블록에 위치해야 하므로
# /etc/nginx/nginx.conf 의 http { } 안에 아래 줄 추가 필요:
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name surbi.kr www.surbi.kr;

    # Cloudflare Origin 인증서 (Full Strict)
    ssl_certificate     /etc/ssl/certs/surbi.crt;
    ssl_certificate_key /etc/ssl/private/surbi.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ── FastAPI API ──────────────────────────
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    on;

        # Rate Limiting (Nginx 레이어)
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ── Flutter Web 정적 파일 ────────────────
    location / {
        root      /var/www/html;
        index     index.html;
        # Flutter SPA: 모든 경로 → index.html fallback
        try_files $uri $uri/ /index.html;

        # Wasm MIME 타입 명시
        types {
            application/wasm wasm;
        }

        # 정적 자산 장기 캐시
        location ~* \.(js|css|wasm|png|jpg|svg|ico|woff2)$ {
            expires    30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── 헬스체크 ──────────────────────────────
    location /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name surbi.kr www.surbi.kr;
    return 301 https://$host$request_uri;
}
